[package]
name = "purrdroid-adb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A small adb client: connects to Android's debugging bridge with an RSA key, runs shell commands and moves files"

[dependencies]
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize.workspace = true
